<!DOCTYPE html> 
<html lang="ru"> 
<head> 
<meta charset="utf-8"> 
<title>Таблицы в HTML5</title> 
<style>
    table, th, td { 
        width: 600px;
        height: 100px;
    border: 1px solid black; 
    border-collapse: collapse;
    };
</style>
</head> 
<body> 
<table> 
    <tr>
        <td rowspan="2" >1</td>
        <td>11</td>
        <td rowspan="2" colspan="2">2</td>
    </tr>
    <tr>
        <td>3</td>
    </tr>
     <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
        <td>7</td>
    </tr>
    <tr>
        <td>8</td>
        <td>9</td>
        <td colspan="2" >10</td>
    </tr>
</table>
</body>
</html>
